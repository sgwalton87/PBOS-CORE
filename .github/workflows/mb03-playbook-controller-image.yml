name: MB-03 Protected Cloud Run Controller Image — STAGING BUILD

on:
  push:
    branches:
      - main
      - feat/mb03-cloudrun-playbook-controller-image-20261123
    paths:
      - Dockerfile.mb03-playbook-controller
      - containers/mb03-playbook/controller-smoke.sh
      # Runtime-owned inputs only; audit-only scripts must not republish or rerun readiness.
      - containers/mb03-controller/stage-secrets.sh
      - containers/mb03-controller/staging-smoke.sh
      - containers/mb03-controller/pin-readiness.sh
      - job.mb03-readiness.yaml
      - pbos/tools/mb03-protected-playbook-codex.ts
      - pbos/production-runtime/**
      - pbos/master-builder/**
      - package-lock.json
      - package.json
  pull_request:
    paths:
      - Dockerfile.mb03-playbook-controller
      - containers/mb03-playbook/controller-smoke.sh
      - containers/mb03-controller/stage-secrets.sh
      - containers/mb03-controller/staging-smoke.sh
      - containers/mb03-controller/pin-readiness.sh
      - job.mb03-readiness.yaml
      - infra/mb03/**
      - pbos/tools/mb03-protected-playbook-codex.ts
      - pbos/tools/tests/mb03-*.test.ts
      - .github/workflows/mb03-playbook-controller-image.yml
      - containers/mb03-controller/verify-existing-readiness.py
      - containers/mb03-controller/tests/test_existing_readiness.py
  workflow_dispatch:
    inputs:
      publish_image_source_sha:
        description: Optional exact main SHA for protected image publication only
        required: false
        type: string
      readiness_manifest_sha256:
        description: Exact authorized manifest for one update and check of the existing staging readiness job (leave both inputs blank for build only)
        required: false
        type: string

permissions:
  contents: read
concurrency:
  group: ${{ inputs.readiness_manifest_sha256 && 'mb03-existing-readiness' || format('mb03-cloudrun-controller-image-{0}', github.ref) }}
  cancel-in-progress: ${{ !inputs.readiness_manifest_sha256 }}

jobs:
  offline-build:
    name: Build and test protected controller image — no mission
    if: github.repository == 'sgwalton87/PBOS-CORE' && (!inputs.readiness_manifest_sha256 || inputs.publish_image_source_sha)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Validate manual image publication scope
        if: github.event_name == 'workflow_dispatch' && inputs.publish_image_source_sha
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.publish_image_source_sha }}
          READINESS_MANIFEST: ${{ inputs.readiness_manifest_sha256 }}
        run: |
          set -euo pipefail
          test -z "$READINESS_MANIFEST"
          test "$GITHUB_REF" = refs/heads/main
          test "$REQUESTED_SHA" = "$GITHUB_SHA"
          test "$GITHUB_RUN_ATTEMPT" = 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Exercise the one-shot readiness guards without cloud credentials
        run: python3 -m unittest discover -s containers/mb03-controller/tests -p test_existing_readiness.py
      - name: Verify source and build non-root controller
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          docker build --pull --file Dockerfile.mb03-playbook-controller \
            --tag pbos-mb03-controller:offline "$GITHUB_WORKSPACE"
      - name: Execute zero-credential fail-closed smoke with no network
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --user node --network none --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --mount "type=bind,src=$GITHUB_WORKSPACE/containers/mb03-playbook/controller-smoke.sh,dst=/checks/smoke.sh,readonly" \
            --entrypoint /bin/sh pbos-mb03-controller:offline /checks/smoke.sh
      - name: Exercise root-owned synthetic secret staging, privilege drop and fail-closed paths
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --tmpfs /run:rw,nosuid,nodev,size=4m \
            --tmpfs /var/lib:rw,nosuid,nodev,size=4m \
            --mount "type=bind,src=$GITHUB_WORKSPACE/containers/mb03-controller/staging-smoke.sh,dst=/checks/staging-smoke.sh,readonly" \
            --entrypoint /bin/sh pbos-mb03-controller:offline /checks/staging-smoke.sh
      - name: Validate digest pinning is fail-closed without cloud access
        shell: bash
        run: |
          set -euo pipefail
          image="us-west1-docker.pkg.dev/pbos-genesis-staging/pbos-executor/mb03-playbook-controller@sha256:$(printf 'a%.0s' {1..64})"
          sh containers/mb03-controller/pin-readiness.sh "$image" "$RUNNER_TEMP/mb03-pinned-smoke.yaml"
          grep -Fq "image: $image" "$RUNNER_TEMP/mb03-pinned-smoke.yaml"
          if sh containers/mb03-controller/pin-readiness.sh "not-a-digest" "$RUNNER_TEMP/mb03-invalid.yaml"; then
            echo "invalid image accepted" >&2
            exit 1
          fi

  update-existing-readiness:
    name: Apply pinned existing readiness job and check Mission 001 journal access once
    if: >-
      github.event_name == 'workflow_dispatch' && !inputs.publish_image_source_sha && github.run_attempt == '1' &&
      github.repository == 'sgwalton87/PBOS-CORE' && github.ref == 'refs/heads/main' &&
      inputs.readiness_manifest_sha256 == '2b4299d010b2e09772b3c9a31da3c02a28f6e605ec2c8ef77bcb3e618c32968f'
    runs-on: ubuntu-latest
    environment: pbos-genesis-staging
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check one-shot update and execution guards
        run: python3 -m unittest discover -s containers/mb03-controller/tests -p test_existing_readiness.py
      - name: Render and verify the authorized journal probe manifest
        shell: bash
        run: |
          set -euo pipefail
          image=us-west1-docker.pkg.dev/pbos-genesis-staging/pbos-executor/mb03-playbook-controller@sha256:ba665785657c6ce715e9cc91cbbe9e92ea1667039ca5b4e936e18d935ebc3ca4
          manifest="$RUNNER_TEMP/mb03-readiness-pinned.yaml"
          sh containers/mb03-controller/pin-readiness.sh "$image" "$RUNNER_TEMP/mb03-bindings.yaml"
          sed 's/^            - --verify-bindings$/            - --verify-mission-001-journal-read/' "$RUNNER_TEMP/mb03-bindings.yaml" > "$manifest"
          echo "2b4299d010b2e09772b3c9a31da3c02a28f6e605ec2c8ef77bcb3e618c32968f  $manifest" | shasum -a 256 --check
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Update existing readiness job and capture the single execution ID
        shell: bash
        run: |
          set -euo pipefail
          python3 -u containers/mb03-controller/verify-existing-readiness.py "$RUNNER_TEMP/mb03-readiness-pinned.yaml" | tee -a "$GITHUB_STEP_SUMMARY"

  publish-staging-image:
    name: Publish controller image to existing pbos-executor — no Cloud Run deploy
    needs: offline-build
    if: >-
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && github.run_attempt == '1' &&
        !inputs.readiness_manifest_sha256 && inputs.publish_image_source_sha == github.sha)) &&
      github.repository == 'sgwalton87/PBOS-CORE' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: pbos-genesis-staging
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Authenticate using existing PBOS staging deploy identity
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Check exact branch, scoped project and existing Artifact Registry
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          gcloud artifacts repositories describe pbos-executor \
            --project=pbos-genesis-staging --location=us-west1 --format='value(name)'
      - name: Build and publish controller only
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="us-west1-docker.pkg.dev/pbos-genesis-staging/pbos-executor/mb03-playbook-controller:$GITHUB_SHA"
          gcloud auth configure-docker us-west1-docker.pkg.dev --quiet
          docker build --pull --file Dockerfile.mb03-playbook-controller --tag "$IMAGE" .
          docker push "$IMAGE"
          DIGEST="$(gcloud artifacts docker images describe "$IMAGE" --format='value(image_summary.digest)')"
          PINNED="us-west1-docker.pkg.dev/pbos-genesis-staging/pbos-executor/mb03-playbook-controller@$DIGEST"
          sh containers/mb03-controller/pin-readiness.sh "$PINNED" "$RUNNER_TEMP/mb03-readiness-pinned.yaml"
          echo "PINNED=$PINNED" >> "$GITHUB_ENV"
          echo "## MB-03 dedicated controller staging image" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image reference: $IMAGE" >> "$GITHUB_STEP_SUMMARY"
          echo "- Code commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Pinned image: $PINNED" >> "$GITHUB_STEP_SUMMARY"
          echo "- Readiness manifest artifact generated; no Cloud Run job replaced" >> "$GITHUB_STEP_SUMMARY"
          echo "- Existing repository: pbos-executor / us-west1" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Not** an activated job; no secrets, Genesis mounts, mission or Cloud Run execution." >> "$GITHUB_STEP_SUMMARY"
      - name: Validate image-pinned readiness manifest offline
        shell: bash
        run: |
          set -euo pipefail
          readiness=pbos-mb03-playbook-readiness
          manifest="$RUNNER_TEMP/mb03-readiness-pinned.yaml"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -f "$manifest"
          grep -Fqx "  name: $readiness" "$manifest"
          grep -Fq "image: $PINNED" "$manifest"
          grep -Fq -- "- --verify-bindings" "$manifest"
          grep -Fq -- 'value: "false"' "$manifest"
          grep -Fq 'readOnly: true' "$manifest"
          grep -Fq "maxRetries: 0" "$manifest"
          if grep -Fq "mb03-provider-signing-key" "$manifest" ||
             grep -Fq 'value: "true"' "$manifest" ||
             grep -Fq "name: pbos-mb03-playbook-codex" "$manifest"; then
            echo "BLOCKED: readiness manifest could enable signed execution" >&2
            exit 2
          fi
      - name: Preserve digest-pinned non-mission readiness manifest for separate review
        uses: actions/upload-artifact@v4
        with:
          name: mb03-readiness-pinned-${{ github.sha }}
          path: ${{ runner.temp }}/mb03-readiness-pinned.yaml
          retention-days: 7
