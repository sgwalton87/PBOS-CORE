name: PBOS Cloud Runner Readiness Gate

# First cloud-execution phase: evidence only. This workflow is deliberately
# incapable of minting operator authority, creating missions, or deploying.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/pbos-cloud-runner-readiness.yml"
      - "pbos/production-runtime/**"
      - "pbos/genesis-console/**"
      - "pbos/autonomous-authority/**"
      - "scripts/cloud-runner-state-guard*"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: pbos-cloud-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      PBOS_STATE_HOME: "${{ runner.temp }}/pbos-cloud-readiness-isolated"
    steps:
      - name: Checkout exact revision without persistent credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Assert isolated and uninitialized state
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "$PBOS_STATE_HOME"
          mkdir -m 700 "$PBOS_STATE_HOME"
          test ! -e "$PBOS_STATE_HOME/genesis-state.json"
          test ! -e "$PBOS_STATE_HOME/operators.json"
          test ! -e "$PBOS_STATE_HOME/profile.json"
          echo "PASS: ephemeral isolated workspace; no Genesis authority imported"
      - name: Install exact locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Verify cloud state guard tests
        run: node --test scripts/cloud-runner-state-guard.test.cjs
      - name: Confirm ephemeral runner is denied mission authority
        shell: bash
        run: |
          set -euo pipefail
          if node scripts/cloud-runner-state-guard.cjs; then
            echo "ERROR: ephemeral runner was granted mission authority" >&2
            exit 1
          fi
          echo "PASS: cloud mission execution denied without durable canonical state and fenced lease"
      - name: Typecheck PBOS Core
        run: npm run typecheck
      - name: Run PBOS Core tests
        run: npm run test:run
      - name: Build PBOS Core
        run: npm run build
      - name: Verify no operator state or authority was initialized
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "$PBOS_STATE_HOME/genesis-state.json"
          test ! -e "$PBOS_STATE_HOME/operators.json"
          test ! -e "$PBOS_STATE_HOME/profile.json"
          echo "PASS: cloud validation only; no mission, grant, deployment, or state migration"
