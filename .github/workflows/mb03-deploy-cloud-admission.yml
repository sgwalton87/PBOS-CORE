name: MB-03 Deploy Isolated Cloud Admission Job
# Rebuild when admission preflight or its image inputs change; staging approval remains required.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mb03-deploy-cloud-admission.yml'
      - 'Dockerfile.mb03-admission'
      - 'pbos/tools/mb03-hosted-admission-observation.ts'
      - 'pbos/tools/mb03-hosted-executor.ts'
      - 'pbos/master-builder/hosted-playbook-proposal.ts'
      - 'pbos/boot/pps-canon-snapshot-verifier.ts'
      - 'tests/hosted-approved-mission.test.ts'
      - 'tests/hosted-signed-mission-approval.test.ts'
      - 'tests/mb03-hosted-admission-observation.test.ts'
      - 'tests/pps-canon-snapshot-verifier.test.ts'
      - 'tests/neon-mission-approval-nonce-ledger.test.ts'
      - 'infra/neon/mb03-durable-mission-approval-nonce.sql'
      - 'infra/neon/mb03-fenced-mission-checkpoint.sql'
      - 'tests/neon-fenced-mission-checkpoint.test.ts'
      - 'tests/fenced-playbook-pr-executor.test.ts'
      - 'tests/github-app-playbook-pr-api.test.ts'
      - 'tests/hosted-playbook-mission-executable.test.ts'
      - 'tests/mb03-hosted-executor.test.ts'
      - 'tests/hosted-playbook-proposal.test.ts'
      - 'tests/hosted-canon-archive.test.ts'
      - 'pbos/production-runtime/hosted-neon-executor-composition.ts'
      - 'pbos/production-runtime/operator-readonly-preflight.ts'
      - 'pbos/production-runtime/**'
      - 'pbos/genesis-state/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
  workflow_dispatch:
    inputs:
      confirm_staging_only:
        description: 'Type DEPLOY-STAGING-ADMISSION (no autonomous missions)'
        required: true
        type: string
      bind_readiness_resources:
        description: 'Attach reviewed Secret Manager references for read-only readiness'
        type: boolean
        default: false
      bind_canon_archive:
        description: 'Attach the reviewed read-only Canon archive connection'
        type: boolean
        default: false
      bind_genesis_state:
        description: 'Attach the separately approved, fingerprint-pinned staging state snapshot read-only'
        type: boolean
        default: false
concurrency:
  group: mb03-staging-admission
  cancel-in-progress: true
permissions:
  contents: read
  id-token: write
jobs:
  deploy:
    if: ${{ github.event_name == 'push' || inputs.confirm_staging_only == 'DEPLOY-STAGING-ADMISSION' }}
    runs-on: ubuntu-latest
    environment: pbos-genesis-staging
    steps:
      - uses: actions/checkout@v4
      - name: Verify hosted admission gates before deployment
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx vitest run tests/mb03-hosted-admission-observation.test.ts tests/hosted-signed-mission-approval.test.ts tests/hosted-approved-mission.test.ts tests/pps-canon-snapshot-verifier.test.ts tests/neon-mission-approval-nonce-ledger.test.ts tests/neon-fenced-mission-checkpoint.test.ts tests/fenced-playbook-pr-executor.test.ts tests/github-app-playbook-pr-api.test.ts tests/hosted-playbook-mission-executable.test.ts tests/mb03-hosted-executor.test.ts tests/hosted-playbook-proposal.test.ts
          npx tsc --noEmit
          npx vitest run tests/hosted-canon-archive.test.ts
      - name: Authenticate to Google Cloud using short-lived identity
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Reject stale deployment after environment approval
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          HEAD_SHA="$(gh api repos/"${GITHUB_REPOSITORY}"/commits/main --jq '.sha')"
          test "${GITHUB_SHA}" = "${HEAD_SHA}" || {
            echo "::error::Refusing stale admission deployment: main has advanced."
            exit 1
          }
      - name: Build and push admission image directly from GitHub runner
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="us-west1-docker.pkg.dev/pbos-genesis-staging/pbos-executor/mb03-admission:${GITHUB_SHA}"
          # Avoid Cloud Build source-bucket upload entirely. Use the repository-scoped
          # Artifact Registry Writer grant already configured for this identity.
          gcloud artifacts repositories describe pbos-executor --location=us-west1 --project=pbos-genesis-staging --format='value(name)'
          gcloud auth configure-docker us-west1-docker.pkg.dev --quiet
          docker build --file Dockerfile.mb03-admission --tag "${IMAGE}" .
          docker push "${IMAGE}"
      - name: Deploy a disabled-by-default admission job (never executes a mission)
        shell: bash
        env:
          BIND_READINESS: ${{ github.event_name == 'workflow_dispatch' && inputs.bind_readiness_resources }}
          BIND_ARCHIVE: ${{ github.event_name == 'workflow_dispatch' && inputs.bind_canon_archive }}
          BIND_STATE: ${{ github.event_name == 'workflow_dispatch' && inputs.bind_genesis_state }}
          STATE_PIN: ${{ vars.MB03_GENESIS_STATE_SET_SHA256 }}
          OBSERVATION_KEY_SECRET: ${{ vars.MB03_OBSERVATION_KEY_SECRET_VERSION }}
          RUNTIME_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
          NEON_SECRET: ${{ vars.MB03_NEON_SECRET_VERSION }}
          OPERATOR_KEY_SECRET: ${{ vars.MB03_OPERATOR_PUBLIC_KEY_VERSION }}
          NEON_HOST: ${{ vars.MB03_NEON_HOST }}
          NEON_ROLE: ${{ vars.MB03_NEON_ROLE }}
          KEY_FINGERPRINT: ${{ vars.MB03_OPERATOR_PUBLIC_KEY_SHA256 }}
          ARCHIVE_SECRET: ${{ vars.MB03_ARCHIVE_NEON_SECRET_VERSION }}
          ARCHIVE_HOST: ${{ vars.MB03_ARCHIVE_NEON_HOST }}
          ARCHIVE_ROLE: ${{ vars.MB03_ARCHIVE_NEON_ROLE }}
          ARCHIVE_PPS_SOURCE: ${{ vars.MB03_ARCHIVE_PPS_SOURCE_SHA }}
          ARCHIVE_PPS_PIN: ${{ vars.MB03_ARCHIVE_PPS_MANIFEST_SHA256 }}
        run: |
          set -euo pipefail
          describe_job() {
            gcloud run jobs describe pbos-genesis-admission --project=pbos-genesis-staging --region=us-west1 --format=json |
              jq -ce '.spec.template.spec.template.spec | select((.containers | length) == 1)'
          }
          binding_refs() {
            jq -c '[
              ([.containers[0].env[]? | select(.name | IN("PBOS_DATABASE_URL", "PBOS_ARCHIVE_DATABASE_URL"))
                | {key:.name, value:(.valueFrom.secretKeyRef | if . == null then "UNSAFE" else .name + ":" + .key end)}]),
              ([.containers[0].env[]? | select(.name | IN(
                "PBOS_EXPECTED_NEON_HOST", "PBOS_EXPECTED_NEON_ROLE", "PBOS_APPROVAL_PUBLIC_KEY_SHA256", "PBOS_APPROVAL_PUBLIC_KEY_FILE",
                "PBOS_EXPECTED_ARCHIVE_NEON_HOST", "PBOS_EXPECTED_ARCHIVE_NEON_ROLE", "PBOS_ARCHIVE_PPS_SOURCE_SHA",
                "PBOS_ARCHIVE_PPS_MANIFEST_SHA256", "PBOS_EXPECTED_RUNTIME_SERVICE_ACCOUNT"))
                | {key:.name, value:.value}]),
              ([.containers[0].volumeMounts[]? | select(.mountPath == "/var/run/pbos-operator") | .name] as $mounts
                | [.volumes[]? | select(.name as $name | $mounts | index($name)) | .secret
                   | {key:"PBOS_OPERATOR_PUBLIC_KEY", value:(.secretName + ":" + (.items[] | select(.path == "public.pem") | .key))}])
              ] | add | from_entries'
          }
          preserve_ref() {
            jq -e --arg key "$1" --arg ref "$2" 'has($key) | not' <<<"$refs_before" >/dev/null ||
              jq -e --arg key "$1" --arg ref "$2" '.[$key] == $ref' <<<"$refs_before" >/dev/null ||
              { echo "::error::Refusing to replace an existing protected reference."; exit 1; }
          }
          before="$(describe_job)"
          refs_before="$(binding_refs <<<"$before")"
          [[ "$RUNTIME_ACCOUNT" == pbos-genesis-executor@pbos-genesis-staging.iam.gserviceaccount.com ]]
          state_path=/var/lib/pbos
          state_volume=mb03-genesis-observation
          key_directory=/var/run/pbos-observation
          key_path=$key_directory/seal.key
          bucket=pbos-genesis-staging-mb03-observation-state
          env_vars=PBOS_STATE_HOME=$state_path
          add_state_volume=false
          current_pin="$(jq -r '[.containers[0].env[]? | select(.name == "PBOS_EXPECTED_STATE_SET_SHA256") | .value] | .[0] // ""' <<<"$before")"
          state_mount_exists() {
            jq -e --arg path "$state_path" --arg name "$state_volume" '
              any(.containers[0].volumeMounts[]?; .mountPath == $path or .name == $name) or
              any(.volumes[]?; .name == $name)' >/dev/null
          }
          verify_state_mount() {
            jq -e --arg path "$state_path" --arg name "$state_volume" --arg bucket "$bucket" --arg pin "$STATE_PIN" \
              --arg keydir "$key_directory" --arg keypath "$key_path" --arg keyref "$OBSERVATION_KEY_SECRET" '
              ([.containers[0].volumeMounts[]? | select(.mountPath == $path or .name == $name)] == [{mountPath:$path,name:$name}]) and
              any(.containers[0].env[]?; .name == "PBOS_STATE_HOME" and .value == $path) and
              any(.containers[0].env[]?; .name == "PBOS_EXPECTED_STATE_SET_SHA256" and .value == $pin) and
              any(.containers[0].env[]?; .name == "PBOS_OBSERVATION_KEY_FILE" and .value == $keypath) and
              ([.containers[0].volumeMounts[]? | select(.mountPath == $keydir) | .name] as $mounts
                | [.volumes[]? | select(.name as $volume | $mounts | index($volume)) | .secret
                   | .secretName + ":" + (.items[] | select(.path == "seal.key") | .key)] == [$keyref]) and
              any(.volumes[]?; .name == $name and .csi.driver == "gcsfuse.run.googleapis.com" and
                .csi.readOnly == true and .csi.volumeAttributes.bucketName == $bucket and
                ((.csi.volumeAttributes.mountOptions // "") | split(",") | sort) ==
                  (["only-dir=mb03-admission/" + $pin,"uid=1000","gid=1000","file-mode=400","dir-mode=500","implicit-dirs=true"] | sort))' >/dev/null
          }
          if [[ -n "$current_pin" ]] || state_mount_exists <<<"$before"; then
            [[ "$STATE_PIN" =~ ^[a-f0-9]{64}$ && "$STATE_PIN" == "$current_pin" &&
              "$OBSERVATION_KEY_SECRET" =~ ^mb03-observation-seal-key:[1-9][0-9]*$ ]] &&
              verify_state_mount <<<"$before" ||
              { echo "::error::Existing Genesis observation storage differs from the approved pin or mount."; exit 1; }
          elif [[ "$BIND_STATE" == true ]]; then
            if ! [[ "$STATE_PIN" =~ ^[a-f0-9]{64}$ && "$OBSERVATION_KEY_SECRET" =~ ^mb03-observation-seal-key:[1-9][0-9]*$ ]]; then
              echo "::error::Snapshot binding requires the approved pin and numbered seal-key secret."
              exit 1
            fi
            env_vars+=",PBOS_EXPECTED_STATE_SET_SHA256=$STATE_PIN,PBOS_OBSERVATION_KEY_FILE=$key_path"
            add_state_volume=true
          elif [[ -n "$STATE_PIN" ]]; then
            echo "::error::Pinned Genesis storage is absent. Explicit protected state binding is required."
            exit 1
          fi
          secret_refs=""
          if [[ "$BIND_READINESS" == true || "$BIND_ARCHIVE" == true ]]; then
            [[ "$RUNTIME_ACCOUNT" == pbos-genesis-executor@pbos-genesis-staging.iam.gserviceaccount.com ]]
            env_vars+=",PBOS_EXPECTED_RUNTIME_SERVICE_ACCOUNT=$RUNTIME_ACCOUNT"
          fi
          if [[ "$BIND_READINESS" == true ]]; then
            [[ "$NEON_SECRET" =~ ^[A-Za-z0-9_-]+:[1-9][0-9]*$ && "$OPERATOR_KEY_SECRET" =~ ^[A-Za-z0-9_-]+:[1-9][0-9]*$ ]]
            [[ "$NEON_HOST" =~ ^[a-z0-9.-]+\.neon\.tech$ && "$NEON_ROLE" =~ ^[A-Za-z_][A-Za-z0-9_]*$ && "$KEY_FINGERPRINT" =~ ^[a-f0-9]{64}$ ]]
            preserve_ref PBOS_DATABASE_URL "$NEON_SECRET"
            preserve_ref PBOS_OPERATOR_PUBLIC_KEY "$OPERATOR_KEY_SECRET"
            preserve_ref PBOS_EXPECTED_NEON_HOST "$NEON_HOST"
            preserve_ref PBOS_EXPECTED_NEON_ROLE "$NEON_ROLE"
            preserve_ref PBOS_APPROVAL_PUBLIC_KEY_SHA256 "$KEY_FINGERPRINT"
            preserve_ref PBOS_APPROVAL_PUBLIC_KEY_FILE /var/run/pbos-operator/public.pem
            secret_refs="PBOS_DATABASE_URL=$NEON_SECRET,/var/run/pbos-operator/public.pem=$OPERATOR_KEY_SECRET"
            env_vars+=",PBOS_EXPECTED_NEON_HOST=$NEON_HOST,PBOS_EXPECTED_NEON_ROLE=$NEON_ROLE,PBOS_APPROVAL_PUBLIC_KEY_FILE=/var/run/pbos-operator/public.pem,PBOS_APPROVAL_PUBLIC_KEY_SHA256=$KEY_FINGERPRINT"
          fi
          if [[ "$BIND_ARCHIVE" == true ]]; then
            [[ "$ARCHIVE_SECRET" =~ ^[A-Za-z0-9_-]+:[1-9][0-9]*$ && "${ARCHIVE_SECRET%%:*}" != "${NEON_SECRET%%:*}" ]]
            [[ "$ARCHIVE_HOST" =~ ^[a-z0-9.-]+\.neon\.tech$ && "$ARCHIVE_ROLE" =~ ^[A-Za-z_][A-Za-z0-9_]*$ && "$ARCHIVE_ROLE" != pbos_runner_owner && "$ARCHIVE_ROLE" != "$NEON_ROLE" ]]
            [[ "$ARCHIVE_PPS_SOURCE" =~ ^[a-f0-9]{40}$ && "$ARCHIVE_PPS_PIN" =~ ^[a-f0-9]{64}$ ]]
            preserve_ref PBOS_ARCHIVE_DATABASE_URL "$ARCHIVE_SECRET"
            preserve_ref PBOS_EXPECTED_ARCHIVE_NEON_HOST "$ARCHIVE_HOST"
            preserve_ref PBOS_EXPECTED_ARCHIVE_NEON_ROLE "$ARCHIVE_ROLE"
            preserve_ref PBOS_ARCHIVE_PPS_SOURCE_SHA "$ARCHIVE_PPS_SOURCE"
            preserve_ref PBOS_ARCHIVE_PPS_MANIFEST_SHA256 "$ARCHIVE_PPS_PIN"
            secret_refs+="${secret_refs:+,}PBOS_ARCHIVE_DATABASE_URL=$ARCHIVE_SECRET"
            env_vars+=",PBOS_EXPECTED_ARCHIVE_NEON_HOST=$ARCHIVE_HOST,PBOS_EXPECTED_ARCHIVE_NEON_ROLE=$ARCHIVE_ROLE,PBOS_ARCHIVE_PPS_SOURCE_SHA=$ARCHIVE_PPS_SOURCE,PBOS_ARCHIVE_PPS_MANIFEST_SHA256=$ARCHIVE_PPS_PIN"
          fi
          if [[ "$add_state_volume" == true ]]; then
            secret_refs+="${secret_refs:+,}$key_path=$OBSERVATION_KEY_SECRET"
          fi
          args=("--update-env-vars=$env_vars")
          if [[ -n "$secret_refs" ]]; then args+=("--update-secrets=$secret_refs"); fi
          if [[ "$add_state_volume" == true ]]; then
            # Cloud Run jobs always use the second-generation environment.
            args+=(
              "--add-volume=name=$state_volume,type=cloud-storage,bucket=$bucket,readonly=true,mount-options=only-dir=mb03-admission/$STATE_PIN;uid=1000;gid=1000;file-mode=400;dir-mode=500;implicit-dirs=true"
              "--add-volume-mount=volume=$state_volume,mount-path=$state_path")
          fi
          gcloud run jobs deploy pbos-genesis-admission \
            --project=pbos-genesis-staging --region=us-west1 \
            --image="us-west1-docker.pkg.dev/pbos-genesis-staging/pbos-executor/mb03-admission:${GITHUB_SHA}" \
            --tasks=1 --max-retries=0 --task-timeout=600s \
            --service-account="$RUNTIME_ACCOUNT" \
            --cpu=1 --memory=1Gi \
            "${args[@]}"
          after="$(describe_job)"
          refs_after="$(binding_refs <<<"$after")"
          jq -e --argjson before "$refs_before" '. as $after |
            all($before | to_entries[]; . as $item | $after[$item.key] == $item.value)' <<<"$refs_after" >/dev/null ||
            { echo "::error::An existing protected reference was lost or changed."; exit 1; }
          if [[ -n "$STATE_PIN" ]]; then
            verify_state_mount <<<"$after" ||
              { echo "::error::Read-back did not confirm the approved read-only observation mount."; exit 1; }
          fi
          echo "Admission observer image deployed; NOT executed."
      - name: Verify deployed Cloud Run job identity and image without executing
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_IMAGE="us-west1-docker.pkg.dev/pbos-genesis-staging/pbos-executor/mb03-admission:${GITHUB_SHA}"
          EXPECTED_SA="${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}"
          ACTUAL_IMAGE="$(gcloud run jobs describe pbos-genesis-admission --project=pbos-genesis-staging --region=us-west1 --format='value(spec.template.spec.template.spec.containers[0].image)')"
          ACTUAL_SA="$(gcloud run jobs describe pbos-genesis-admission --project=pbos-genesis-staging --region=us-west1 --format='value(spec.template.spec.template.spec.serviceAccountName)')"
          test -n "${ACTUAL_IMAGE}" && test "${ACTUAL_IMAGE}" = "${EXPECTED_IMAGE}"
          test -n "${ACTUAL_SA}" && test "${ACTUAL_SA}" = "${EXPECTED_SA}"
          echo "Verified deployed image: ${ACTUAL_IMAGE}"
          echo "Verified runtime identity: ${ACTUAL_SA}"
          echo "Job has not been executed; mission authority remains disabled."
