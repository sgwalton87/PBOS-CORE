name: MB-03 Deploy Isolated Cloud Admission Job
on:
  workflow_dispatch:
    inputs:
      confirm_staging_only:
        description: 'Type DEPLOY-STAGING-ADMISSION (no autonomous missions)'
        required: true
        type: string
permissions:
  contents: read
  id-token: write
jobs:
  deploy:
    if: ${{ inputs.confirm_staging_only == 'DEPLOY-STAGING-ADMISSION' }}
    runs-on: ubuntu-latest
    environment: pbos-genesis-staging
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud using short-lived identity
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Preflight cloud build dependencies before uploading source
        shell: bash
        run: |
          set -euo pipefail
          PROJECT=pbos-genesis-staging
          REGION=us-west1
          BUCKET="${PROJECT}_cloudbuild"
          echo "::group::Cloud build source bucket"
          gcloud storage buckets describe "gs://${BUCKET}" --project="${PROJECT}" --format='value(name)'
          # The source upload uses this identity; test access without modifying objects.
          gcloud storage ls "gs://${BUCKET}/" >/dev/null
          echo "::endgroup::"
          echo "::group::Cloud Build service account"
          gcloud builds get-default-service-account --project="${PROJECT}" --region="${REGION}"
          echo "::endgroup::"
          echo "::group::Artifact Registry destination"
          gcloud artifacts repositories describe pbos-executor --location="${REGION}" --project="${PROJECT}" --format='value(name)'
          echo "::endgroup::"
          echo "Preflight passed. This does not verify runtime mission authorization or downstream IAM."
      - name: Build isolated admission image in Google Cloud
        shell: bash
        run: |
          set -euo pipefail
          gcloud config set project pbos-genesis-staging
          gcloud artifacts repositories describe pbos-executor --location=us-west1 --project=pbos-genesis-staging --format='value(name)'
          gcloud builds submit . --region=us-west1 --config=cloudbuild.mb03-admission.yaml --substitutions="_IMAGE=us-west1-docker.pkg.dev/pbos-genesis-staging/pbos-executor/mb03-admission:${GITHUB_SHA}"
      - name: Deploy a disabled-by-default admission job (never executes a mission)
        shell: bash
        run: |
          set -euo pipefail
          gcloud run jobs deploy pbos-genesis-admission \
            --project=pbos-genesis-staging --region=us-west1 \
            --image="us-west1-docker.pkg.dev/pbos-genesis-staging/pbos-executor/mb03-admission:${GITHUB_SHA}" \
            --tasks=1 --max-retries=0 --task-timeout=600s \
            --service-account="${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}" \
            --cpu=1 --memory=1Gi \
            --set-env-vars=PBOS_STATE_HOME=/var/lib/pbos
          echo "Job deployed; NOT executed. No private state mounted and no mission authority granted."
