name: MB-03 Deploy Isolated Cloud Admission Job
# Rebuild when admission preflight or its image inputs change; staging approval remains required.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mb03-deploy-cloud-admission.yml'
      - 'Dockerfile.mb03-admission'
      - 'pbos/tools/mb03-hosted-admission-observation.ts'
      - 'pbos/boot/pps-canon-snapshot-verifier.ts'
      - 'tests/hosted-approved-mission.test.ts'
      - 'tests/hosted-signed-mission-approval.test.ts'
      - 'tests/mb03-hosted-admission-observation.test.ts'
      - 'tests/pps-canon-snapshot-verifier.test.ts'
      - 'tests/neon-mission-approval-nonce-ledger.test.ts'
      - 'infra/neon/mb03-durable-mission-approval-nonce.sql'
      - 'infra/neon/mb03-fenced-mission-checkpoint.sql'
      - 'tests/neon-fenced-mission-checkpoint.test.ts'
      - 'tests/fenced-playbook-pr-executor.test.ts'
      - 'pbos/production-runtime/hosted-neon-executor-composition.ts'
      - 'pbos/production-runtime/operator-readonly-preflight.ts'
      - 'pbos/production-runtime/**'
      - 'pbos/genesis-state/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
  workflow_dispatch:
    inputs:
      confirm_staging_only:
        description: 'Type DEPLOY-STAGING-ADMISSION (no autonomous missions)'
        required: true
        type: string
concurrency:
  group: mb03-staging-admission
  cancel-in-progress: true
permissions:
  contents: read
  id-token: write
jobs:
  deploy:
    if: ${{ github.event_name == 'push' || inputs.confirm_staging_only == 'DEPLOY-STAGING-ADMISSION' }}
    runs-on: ubuntu-latest
    environment: pbos-genesis-staging
    steps:
      - uses: actions/checkout@v4
      - name: Verify hosted admission gates before deployment
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx vitest run tests/mb03-hosted-admission-observation.test.ts tests/hosted-signed-mission-approval.test.ts tests/hosted-approved-mission.test.ts tests/pps-canon-snapshot-verifier.test.ts tests/neon-mission-approval-nonce-ledger.test.ts tests/neon-fenced-mission-checkpoint.test.ts tests/fenced-playbook-pr-executor.test.ts
          npx tsc --noEmit
      - name: Authenticate to Google Cloud using short-lived identity
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Reject stale deployment after environment approval
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          HEAD_SHA="$(gh api repos/"${GITHUB_REPOSITORY}"/commits/main --jq '.sha')"
          test "${GITHUB_SHA}" = "${HEAD_SHA}" || {
            echo "::error::Refusing stale admission deployment: main has advanced."
            exit 1
          }
      - name: Build and push admission image directly from GitHub runner
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="us-west1-docker.pkg.dev/pbos-genesis-staging/pbos-executor/mb03-admission:${GITHUB_SHA}"
          # Avoid Cloud Build source-bucket upload entirely. Use the repository-scoped
          # Artifact Registry Writer grant already configured for this identity.
          gcloud artifacts repositories describe pbos-executor --location=us-west1 --project=pbos-genesis-staging --format='value(name)'
          gcloud auth configure-docker us-west1-docker.pkg.dev --quiet
          docker build --file Dockerfile.mb03-admission --tag "${IMAGE}" .
          docker push "${IMAGE}"
      - name: Deploy a disabled-by-default admission job (never executes a mission)
        shell: bash
        run: |
          set -euo pipefail
          gcloud run jobs deploy pbos-genesis-admission \
            --project=pbos-genesis-staging --region=us-west1 \
            --image="us-west1-docker.pkg.dev/pbos-genesis-staging/pbos-executor/mb03-admission:${GITHUB_SHA}" \
            --tasks=1 --max-retries=0 --task-timeout=600s \
            --service-account="${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}" \
            --cpu=1 --memory=1Gi \
            --set-env-vars=PBOS_STATE_HOME=/var/lib/pbos
          echo "Job deployed; NOT executed. No private state mounted and no mission authority granted."
      - name: Verify deployed Cloud Run job identity and image without executing
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_IMAGE="us-west1-docker.pkg.dev/pbos-genesis-staging/pbos-executor/mb03-admission:${GITHUB_SHA}"
          EXPECTED_SA="${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}"
          ACTUAL_IMAGE="$(gcloud run jobs describe pbos-genesis-admission --project=pbos-genesis-staging --region=us-west1 --format='value(template.template.containers[0].image)')"
          ACTUAL_SA="$(gcloud run jobs describe pbos-genesis-admission --project=pbos-genesis-staging --region=us-west1 --format='value(template.template.serviceAccount)')"
          test -n "${ACTUAL_IMAGE}" && test "${ACTUAL_IMAGE}" = "${EXPECTED_IMAGE}"
          test -n "${ACTUAL_SA}" && test "${ACTUAL_SA}" = "${EXPECTED_SA}"
          echo "Verified deployed image: ${ACTUAL_IMAGE}"
          echo "Verified runtime identity: ${ACTUAL_SA}"
          echo "Job has not been executed; mission authority remains disabled."
