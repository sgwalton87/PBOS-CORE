name: PBOS MB-03.8 Publish Bundled-Source Canary Image

on:
  workflow_dispatch:
    inputs:
      image_source_sha:
        description: Reviewed PR 106 image-bundled source commit
        required: true
        type: string
      publish:
        description: Authorize sending the validated image to the dedicated VCR project
        required: true
        type: boolean
        default: false

permissions: {}

concurrency:
  group: mb032-vcr-publish
  cancel-in-progress: false

env:
  IMAGE_SOURCE_SHA: 8a6f3d300f652828348eef319fc19301452c9867
  IMAGE_PARENT_SHA: d6f62e150b5f4a1394428ee34ce41f322bedb855
  CANARY_RUNTIME_SHA: 121ce910d47ef65e76416d666220204ef17496e9
  CODEX_SHA256: b76a027d6b210f9a8da7aaf321dd235c700f0ef7a794d4a5314b9af6c134f0f0
  VCR_TEAM_ID: team_uEIqx3HHy04a9D2ePf3NwRdl
  VCR_PROJECT_ID: prj_1zGe3VEqWFxaBgxRfKYPI9hafyg9
  VCR_REPOSITORY: vcr.vercel.com/pbos-genesis/pbos-mb03-canary/canary

jobs:
  validate-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.archive.outputs.artifact-id }}
      bundle_sha256: ${{ steps.bundle.outputs.sha256 }}
    steps:
      - name: Check dispatcher and exact reviewed source
        env:
          REQUESTED_SHA: ${{ inputs.image_source_sha }}
        run: |
          test "$GITHUB_REPOSITORY" = sgwalton87/PBOS-CORE
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$REQUESTED_SHA" = "$IMAGE_SOURCE_SHA"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.IMAGE_SOURCE_SHA }}
          fetch-depth: 3
          persist-credentials: false
      - name: Build and verify the reviewed AMD64 image
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$IMAGE_SOURCE_SHA"
          test "$(git rev-parse HEAD^)" = "$IMAGE_PARENT_SHA"
          test "$(git rev-parse HEAD^)" = "$IMAGE_PARENT_SHA"
          test "$(git merge-base HEAD "$CANARY_RUNTIME_SHA")" = "$CANARY_RUNTIME_SHA"

          docker build --platform linux/amd64 --tag pbos-mb032-canary:validated containers/mb032-canary
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' pbos-mb032-canary:validated)" = linux/amd64
          checks="$(mktemp -d "$RUNNER_TEMP/pbos-image-checks.XXXXXX")"
          python3 containers/mb032-canary/extract-probes.py pbos/master-builder/vercel-remote-provider.ts "$checks"
          cp containers/mb032-canary/smoke.sh "$checks/"
          docker run --rm --network none --entrypoint /bin/sh \
            --mount "type=bind,src=$checks,dst=/checks,readonly" pbos-mb032-canary:validated /checks/smoke.sh

          actual="$(docker run --rm --network none --entrypoint /usr/bin/sha256sum \
            pbos-mb032-canary:validated /usr/local/bin/codex)"
          test "$actual" = "$CODEX_SHA256  /usr/local/bin/codex"
      - name: Seal the validated image bundle
        id: bundle
        if: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/canary-bundle"
          docker save pbos-mb032-canary:validated | gzip -n > "$RUNNER_TEMP/canary-bundle/image.tar.gz"
          sha256sum "$RUNNER_TEMP/canary-bundle/image.tar.gz" | awk '{print "sha256=" $1}' >> "$GITHUB_OUTPUT"
      - name: Transfer the validated image to the protected job
        id: archive
        if: ${{ inputs.publish }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mb032-canary-validated-image
          path: ${{ runner.temp }}/canary-bundle/image.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish-image:
    needs: validate-image
    if: ${{ inputs.publish && github.repository == 'sgwalton87/PBOS-CORE' && github.ref == 'refs/heads/main' && github.run_attempt == 1 }}
    environment: mb032-vcr-publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      id-token: write
    steps:
      - name: Require configured protection and recorded independent approval
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIGURED_PROJECT: ${{ vars.PBOS_VCR_PROJECT_ID }}
          CONFIGURED_TEAM: ${{ vars.PBOS_VCR_TEAM_ID }}
          VCR_POLICY_ID: ${{ vars.PBOS_VCR_OIDC_POLICY_ID }}
        run: |
          set -euo pipefail
          test "$CONFIGURED_PROJECT" = "$VCR_PROJECT_ID"
          test "$CONFIGURED_TEAM" = "$VCR_TEAM_ID"
          test -n "$VCR_POLICY_ID"
          protection="repos/$GITHUB_REPOSITORY/environments/mb032-vcr-publish"
          environment="$(gh api "$protection")"
          environment_id="$(jq -er '
            select(.name == "mb032-vcr-publish" and
              .deployment_branch_policy.custom_branch_policies == true and
              .deployment_branch_policy.protected_branches == false and
              .can_admins_bypass == false)
            | .id | select(type == "number")
          ' <<<"$environment")"
          reviewers="$(jq -ce --arg dispatcher "$GITHUB_ACTOR_ID" '
            [.protection_rules[] | select(.type == "required_reviewers" and .prevent_self_review == true)
              | .reviewers[] | select(.type == "User" and (.reviewer.id | type) == "number")
              | .reviewer.id | select(tostring != $dispatcher)]
            | unique | select(length > 0)
          ' <<<"$environment")"
          gh api "$protection/deployment-branch-policies" |
            jq -e '.total_count == 1 and (.branch_policies | length) == 1
              and .branch_policies[0].name == "main"
              and (.branch_policies[0].type // "branch") == "branch"' >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/approvals" |
            jq -e --argjson reviewers "$reviewers" --argjson environment_id "$environment_id" '
              any(.[]; .state == "approved" and
                (.user.id as $id | $reviewers | index($id) != null) and
                any(.environments[]; .id == $environment_id and .name == "mb032-vcr-publish"))
            ' >/dev/null
      - name: Retrieve the exact validated bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.validate-image.outputs.artifact_id }}
          path: ${{ runner.temp }}/canary-bundle
      - name: Verify bundle, platform and Codex digest before registry login
        env:
          EXPECTED_BUNDLE: ${{ needs.validate-image.outputs.bundle_sha256 }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_BUNDLE" =~ ^[a-f0-9]{64}$ ]]
          printf '%s  %s\n' "$EXPECTED_BUNDLE" "$RUNNER_TEMP/canary-bundle/image.tar.gz" | sha256sum --check -
          docker load --input "$RUNNER_TEMP/canary-bundle/image.tar.gz"
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' pbos-mb032-canary:validated)" = linux/amd64
          actual="$(docker run --rm --network none --entrypoint /usr/bin/sha256sum \
            pbos-mb032-canary:validated /usr/local/bin/codex)"
          test "$actual" = "$CODEX_SHA256  /usr/local/bin/codex"
      - name: Log into VCR with short-lived GitHub OIDC
        uses: vercel/vcr-action/login@6888f841cb0d2255ef9dab40f068cba07234ef47 # v1
        with:
          team: ${{ env.VCR_TEAM_ID }}
          audience: https://vercel.com/pbos-genesis/mb032-vcr-publish
          policy: ${{ vars.PBOS_VCR_OIDC_POLICY_ID }}
          engines: docker
          registry: vcr.vercel.com
          logout: true
          revoke: true
      - name: Push the tested image and verify the registry artifact
        run: |
          set -euo pipefail
          tag="$VCR_REPOSITORY:mb038-$IMAGE_SOURCE_SHA-$GITHUB_RUN_ID"
          docker tag pbos-mb032-canary:validated "$tag"
          docker push "$tag" | tee "$RUNNER_TEMP/vcr-push.log"
          digest="$(sed -nE 's/^.*digest: (sha256:[a-f0-9]{64}) size: [0-9]+$/\1/p' "$RUNNER_TEMP/vcr-push.log")"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          immutable="$VCR_REPOSITORY@$digest"

          registry_digest="$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$immutable")"
          test "$registry_digest" = "$digest"
          docker image rm "$tag" pbos-mb032-canary:validated
          docker pull --platform linux/amd64 "$immutable"
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$immutable")" = linux/amd64
          actual="$(docker run --rm --network none --entrypoint /usr/bin/sha256sum "$immutable" /usr/local/bin/codex)"
          test "$actual" = "$CODEX_SHA256  /usr/local/bin/codex"

          jq -n --arg image "$immutable" --arg digest "$digest" --arg platform linux/amd64 \
            --arg binarySha256 "$CODEX_SHA256" --arg imageSourceSha "$IMAGE_SOURCE_SHA" \
            --arg canaryRuntimeSha "$CANARY_RUNTIME_SHA" --arg projectId "$VCR_PROJECT_ID" \
            --arg workflowSha "$GITHUB_SHA" --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{image:$image,digest:$digest,platform:$platform,binarySha256:$binarySha256,imageSourceSha:$imageSourceSha,
              canaryRuntimeSha:$canaryRuntimeSha,projectId:$projectId,workflowSha:$workflowSha,run:$run}' \
            > "$RUNNER_TEMP/verified-vcr-image.json"
          printf 'Verified VCR image\n\n`%s`\n' "$immutable" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain the verified publication evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mb032-verified-vcr-image
          path: ${{ runner.temp }}/verified-vcr-image.json
          if-no-files-found: error
          retention-days: 90
