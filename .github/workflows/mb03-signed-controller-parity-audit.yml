name: MB-03 Signed Controller Parity Audit — READ ONLY
# Describes (never deploys/executes) the actual signed and readiness Cloud Run jobs.
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/mb03-signed-controller-parity-audit.yml
      - containers/mb03-controller/audit-signed-controller-parity.mjs
      - containers/mb03-controller/audit-signed-controller-parity.nodecheck.mjs
      - infra/mb03/job.signed-mission.review-only.yaml
  pull_request:
    paths:
      - .github/workflows/mb03-signed-controller-parity-audit.yml
      - containers/mb03-controller/audit-signed-controller-parity.mjs
      - containers/mb03-controller/audit-signed-controller-parity.nodecheck.mjs
      - infra/mb03/job.signed-mission.review-only.yaml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mb03-signed-job-parity-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-audit-tests:
    name: Exercise fail-closed parity tests without cloud credentials
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify exact branch and execute synthetic tests only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --test containers/mb03-controller/audit-signed-controller-parity.nodecheck.mjs
  inspect-staging-job:
    name: Compare existing Cloud Run job bindings — NO EXECUTION
    needs: offline-audit-tests
    if: >-
      github.event_name != 'pull_request' &&
      github.repository == 'sgwalton87/PBOS-CORE' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pbos-genesis-staging
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Read-only describe of separate staging jobs and sanitized parity report
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          region=us-west1
          project=pbos-genesis-staging
          dir="$(mktemp -d)"
          chmod 0700 "$dir"
          trap 'rm -rf "$dir"' EXIT
          if ! gcloud run jobs describe pbos-mb03-playbook-readiness --region="$region" \
            --project="$project" --format=json > "$dir/readiness.json" 2>/dev/null; then
            echo '{"status":"BLOCKED","checks":"CONFIG_PARITY_ONLY","findings":["READINESS_JOB_MISSING_OR_UNREADABLE"]}'
            exit 1
          fi
          if ! gcloud run jobs describe pbos-mb03-playbook-codex --region="$region" \
            --project="$project" --format=json > "$dir/signed.json" 2>/dev/null; then
            echo '{"status":"BLOCKED","checks":"CONFIG_PARITY_ONLY","findings":["SIGNED_JOB_MISSING_OR_UNREADABLE"]}'
            exit 1
          fi
          set +e
          node containers/mb03-controller/audit-signed-controller-parity.mjs \
            "$dir/readiness.json" "$dir/signed.json" > "$dir/report.json"
          status=$?
          set -e
          # Output contains only predefined finding codes, never raw secret bindings.
          cat "$dir/report.json"
          echo "### MB-03 SIGNED JOB READ-ONLY CONFIGURATION PARITY" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Readiness reference: pbos-mb03-playbook-readiness" >> "$GITHUB_STEP_SUMMARY"
          echo "- Signed reference: pbos-mb03-playbook-codex" >> "$GITHUB_STEP_SUMMARY"
          echo "- No job changed, no signature read, no execution attempted" >> "$GITHUB_STEP_SUMMARY"
          echo "~~~json" >> "$GITHUB_STEP_SUMMARY"
          cat "$dir/report.json" >> "$GITHUB_STEP_SUMMARY"
          echo "~~~" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
