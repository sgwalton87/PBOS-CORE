name: PBOS Core Read-Only Preflight

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pbos-preflight-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-certification-preflight:
    name: Typecheck, tests and build (no runtime authority)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      PBOS_STATE_HOME: "/tmp/pbos-isolated-preflight"
    steps:
      - name: Checkout exact candidate revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and integration tests
        run: npm run test:run
      - name: MB-02 disposable worktree and signed worker admission regression
        run: npx vitest run pbos/master-builder/tests/disposable-worker-handoff.test.ts pbos/master-builder/tests/disposable-runner-integration.test.ts pbos/master-builder/tests/disposable-cycle-evidence.test.ts
      - name: Build
        run: npm run build
      - name: Record no-authority boundary
        run: |
          echo "Source validation only; no authenticated operator state was inspected."
          echo "No PBOS live mission, production connector, or deployment was started."
