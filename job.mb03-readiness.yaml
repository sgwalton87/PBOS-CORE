# MB-03 signature-free readiness ONLY. Not a mission execution manifest.
# Replace image placeholder with reviewed sha256 digest before separate staging validation.
apiVersion: run.googleapis.com/v1
kind: Job
metadata:
  name: pbos-mb03-playbook-codex
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/execution-environment: gen2
    spec:
      template:
        spec:
          serviceAccountName: pbos-mb03-playbook-codex@pbos-genesis-staging.iam.gserviceaccount.com
          maxRetries: 0
          timeoutSeconds: 600
          containers:
          - image: REPLACE_WITH_APPROVED_CONTROLLER_IMAGE_DIGEST
            command:
            - /usr/local/bin/mb03-stage-secrets
            args:
            - ./node_modules/.bin/tsx
            - pbos/tools/mb03-protected-playbook-codex.ts
            - --verify-bindings
            env:
            - name: PBOS_MISSION_EXECUTION_APPROVED
              value: "false"
            - name: PBOS_MISSION_INPUT_FILE
              value: /var/lib/pbos-missions/mission.json
            - name: PBOS_PROVIDER_SIGNING_KEY_FILE
              value: /var/lib/pbos-private/provider-private.pem
            - name: PBOS_PROVIDER_ID
              value: vercel-pbos-canary
            - name: PBOS_WORKER_ID
              value: vercel-pbos-canary-01
            - name: PBOS_WORKER_MODEL
              value: gpt-4.1-mini
            - name: PBOS_MODEL_ORIGIN
              value: https://mb03-model-ingress.playbookseriesinc.org
            - name: PBOS_MODEL_ADMIN_ORIGIN
              value: https://mb03-model-admin.playbookseriesinc.org
            - name: PBOS_EVIDENCE_DIRECTORY
              value: /var/lib/pbos-evidence
            - name: PBOS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: mb03-execution-neon
                  key: latest
            - name: PBOS_EXPECTED_NEON_HOST
              value: ep-silent-lab-ar43qcr3.c-4.us-west-2.aws.neon.tech
            - name: PBOS_EXPECTED_NEON_ROLE
              value: pbos_mb03_staging_executor
            - name: PBOS_DISPOSABLE_STATE_FILE
              value: /var/lib/pbos-missions/genesis-state.json
            - name: PBOS_STATE_NAMESPACE
              value: mb03-stage4-synthetic-20261124
            - name: PBOS_DISPOSABLE_AUTHORITY_ID
              value: 84464dfd-2ada-4292-a15b-99d3fa5f28e2
            - name: PBOS_OBSERVATION_HOME
              value: /var/lib/pbos-observation
            - name: PBOS_OBSERVATION_KEY_FILE
              value: /var/lib/pbos-private/observation-key
            - name: PBOS_EXPECTED_STATE_SET_SHA256
              value: 2f48068fc89fd278cf4f932ac4ea3cd9ec4e9e2990a330cf78d7551b33ccb47d
            - name: PBOS_PPS_DIRECTORY
              value: /var/run/pbos-canon
            - name: PBOS_PPS_MANIFEST_SHA256
              value: 54fc93d82f5b5b39584776b3b92ba3949f927425d3ee05505803d63b9957b68b
            - name: PBOS_APPROVAL_PUBLIC_KEY_FILE
              value: /var/lib/pbos-private/operator-public.pem
            - name: PBOS_APPROVAL_PUBLIC_KEY_SHA256
              value: db04246cbc743ba2c75652de473ea3aba8e558f954826dd6e30d8bd0425bcff0
            - name: PBOS_APPROVAL_PUBLIC_KEY_PEM
              valueFrom:
                secretKeyRef:
                  name: mb03-operator-public-key
                  key: "1"
            - name: PBOS_PROVIDER_PUBLIC_KEY_FILE
              value: /var/lib/pbos-private/provider-public.pem
            - name: PBOS_PROVIDER_PUBLIC_KEY_SHA256
              value: e4a807a070776cc37dae41c597a24d88a19c5a5d77feae187d57fec37e83345d
            - name: PBOS_PROVIDER_PUBLIC_KEY_PEM
              valueFrom:
                secretKeyRef:
                  name: mb03-provider-public-key
                  key: "1"
            - name: PBOS_PROVIDER_AUTHORITY_ID
              value: mb03-provider-e4a807a070776cc3
            - name: PBOS_DISPATCH_JOURNAL_BUCKET
              value: pbos-genesis-staging-mb03-dispatch-journal
            - name: PBOS_PLAYBOOK_SOURCE_SHA
              value: 6bfa55c69f50b8872f8509a2e8f4e1fe8e415fea
            - name: PBOS_PLAYBOOK_IMAGE
              value: vcr.vercel.com/pbos-genesis/the-playbook/pbos-mb03-playbook-worker@sha256:16f0f932bf78ae440ba00f5e1541bfa056740fe6b7013886e1bc1131f5572e95
            - name: PBOS_CODEX_BINARY_SHA256
              value: b76a027d6b210f9a8da7aaf321dd235c700f0ef7a794d4a5314b9af6c134f0f0
            - name: PBOS_VERCEL_SANDBOX_TEAM_ID
              value: team_uEIqx3HHy04a9D2ePf3NwRdl
            - name: PBOS_VERCEL_SANDBOX_PROJECT_ID
              value: prj_1zGe3VEqWFxaBgxRfKYPI9hafyg9
            - name: PBOS_EXPECTED_RUNTIME_SERVICE_ACCOUNT
              value: pbos-mb03-playbook-codex@pbos-genesis-staging.iam.gserviceaccount.com
            volumeMounts:
            - name: execution-state
              mountPath: /var/lib/pbos-missions
            - name: observation-state
              mountPath: /var/lib/pbos-observation
            - name: pps-canon
              mountPath: /var/run/pbos-canon
            - name: observation-key
              mountPath: /var/run/secrets/mb03/observation
            - name: provider-signing-key
              mountPath: /var/run/secrets/mb03/provider
            - name: provider-public-key
              mountPath: /var/run/secrets/mb03/provider-public
              readOnly: true
            - name: operator-public-key
              mountPath: /var/run/secrets/mb03/operator
              readOnly: true
          volumes:
          - name: execution-state
            csi:
              driver: gcsfuse.run.googleapis.com
              readOnly: true
              volumeAttributes:
                bucketName: pbos-genesis-staging-mb03-execution-state
                mountOptions: only-dir=synthetic,uid=1000,gid=1000,file-mode=0400,dir-mode=0500
          - name: observation-state
            csi:
              driver: gcsfuse.run.googleapis.com
              readOnly: true
              volumeAttributes:
                bucketName: pbos-genesis-staging-mb03-observation-state
                mountOptions: only-dir=mb03-admission/2f48068fc89fd278cf4f932ac4ea3cd9ec4e9e2990a330cf78d7551b33ccb47d,uid=1000,gid=1000,file-mode=0400,dir-mode=0500
          - name: pps-canon
            csi:
              driver: gcsfuse.run.googleapis.com
              readOnly: true
              volumeAttributes:
                bucketName: pbos-genesis-staging-mb03-pps
                mountOptions: only-dir=PPS,uid=1000,gid=1000,file-mode=0400,dir-mode=0500
          - name: observation-key
            secret:
              secretName: mb03-observation-seal-key
              items:
              - key: "1"
                path: key
          - name: provider-signing-key
            secret:
              secretName: mb03-provider-signing-key
              items:
              - key: "1"
                path: private.pem
          - name: operator-public-key
            secret:
              secretName: mb03-operator-public-key
              items:
              - key: "1"
                path: public.pem
          - name: provider-public-key
            secret:
              secretName: mb03-provider-public-key
              items:
              - key: "1"
                path: public.pem
